<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Say It — AhGong &amp; AhMa Says</title>
  <meta name="description" content="One player reads a Hokkien phrase aloud, the other judges the pronunciation." />
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="css/game.css" />
  <!-- the Let's Go button is only used on the last popup screen, several
       steps into the flow — without this, its image isn't requested until
       the player actually gets there, so it visibly pops in late. Starting
       the fetch now gives it the whole name-entry + how-to-play flow to
       finish loading in the background. -->
  <link rel="preload" as="image" href="../00%20Shared%20Assets/btn-letsgo%20200x203px.png" />
</head>
<body>
  <header class="chrome-top">
    <a href="../index.html" class="logo" aria-label="AhGong &amp; AhMa Says — home">
      <img src="../assets/logo-mark.png" alt="AhGong &amp; AhMa Says" />
    </a>
    <div class="chrome-top-right">
      <a href="../games.html" class="icon-btn press" aria-label="Exit to the game homepage">
        <img src="../00%20Shared%20Assets/btn-exit%2080x78px.png" alt="Exit" />
      </a>

        <img src="../00%20Shared%20Assets/btn-langchi%2080x78px.png" alt="中文" />
      </button>

  </header>

  <main id="app" class="container"></main>

  <footer class="chrome-bottom">
    <p class="tagline">we are a multi-generational platform that encourages meaningful interactions through the use of dialect</p>
    <nav class="socials" aria-label="Social and contact links">
      <a href="#" class="social press" aria-label="Instagram"><img src="../00%20Shared%20Assets/btn-ig%2022x22px.png" alt="Instagram" /></a>
      <a href="#" class="social press" aria-label="Email us"><img src="../00%20Shared%20Assets/btn-email%2022x22px.png" alt="Email" /></a>
      <a href="#" class="social press" aria-label="Call or WhatsApp us"><img src="../00%20Shared%20Assets/btn-wa%2022x22px.png" alt="Phone" /></a>
      <a href="#" class="social press" aria-label="Send us a message"><img src="../00%20Shared%20Assets/btn-contactform%2022x22px.png" alt="Message" /></a>
    </nav>
  </footer>

  <script src="js/game.js"></script>
</body>
</html>

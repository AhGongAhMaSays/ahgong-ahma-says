<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Let&rsquo;s Play — AhGong &amp; AhMa Says</title>
  <meta name="description" content="Pick a game: multi-player games and activities for ages 2 to 900." />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/games.css" />
</head>
<body>
  <header class="chrome-top">
    <a href="index.html" class="logo" aria-label="AhGong &amp; AhMa Says — home">
      <img src="assets/logo-mark.png" alt="AhGong &amp; AhMa Says" />
    </a>
    <button type="button" class="icon-btn press" aria-label="Switch language to Chinese">
      <img src="00%20Shared%20Assets/btn-langchi%2080x78px.png" alt="中文" />
    </button>
  </header>

  <footer class="chrome-bottom">
    <p class="tagline">we are a multi-generational platform that encourages meaningful interactions through the use of dialect</p>
    <nav class="socials" aria-label="Social and contact links">
      <a href="#" class="social press" aria-label="Instagram"><img src="00%20Shared%20Assets/btn-ig%2022x22px.png" alt="Instagram" /></a>
      <a href="#" class="social press" aria-label="Email us"><img src="00%20Shared%20Assets/btn-email%2022x22px.png" alt="Email" /></a>
      <a href="#" class="social press" aria-label="Call or WhatsApp us"><img src="00%20Shared%20Assets/btn-wa%2022x22px.png" alt="Phone" /></a>
      <a href="#" class="social press" aria-label="Send us a message"><img src="00%20Shared%20Assets/btn-contactform%2022x22px.png" alt="Message" /></a>
    </nav>
  </footer>

  <main class="container games-main">
    <div class="games-content">
      <h2 class="games-h2">We promise lots of<br class="games-break" /> chaos and fun.</h2>
      <p class="games-sub">Multi-player games and activities<br class="games-break" /> for ages 2 to 900.</p>

      <div class="games-grid">
        <a href="play/index.html" class="game-card game-card--landscape">
          <img class="game-card-img" src="02%20Game%20Homepage/Assets/matching_game-img%20290x200px.png" alt="Dialect Match — a memory matching game" />
          <img class="game-card-tag" src="02%20Game%20Homepage/Assets/img-matchit-title%20220x45px.png" alt="Flip, Match, Score!" />
          <p class="game-card-players">up to 6 players</p>
        </a>

        <a href="say-it/index.html" class="game-card game-card--portrait">
          <img class="game-card-img" src="02%20Game%20Homepage/Assets/img-sayit%20210x300px.png" alt="Say It — pronounce the Hokkien phrase and have it judged" />
          <img class="game-card-tag" src="02%20Game%20Homepage/Assets/img-sayit-title%20220x45px.png" alt="Can you say it?" />
          <p class="game-card-players">2 players</p>
        </a>

        <div class="game-card game-card--landscape game-card--soon" role="group" aria-label="Coming soon">
          <img class="game-card-img" src="02%20Game%20Homepage/Assets/templatel_game-img%20290x200px.png" alt="" />
          <img class="game-card-badge" src="02%20Game%20Homepage/Assets/marquee-comingsoon%2075x75px.png" alt="" />
          <h2 class="game-card-soon-text">more games coming soon!</h2>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
